[project]
name = "raiox"
version = "0.1.0"
description = "Raio-X OPME: quanto o setor público brasileiro paga por stents, próteses e implantes"
readme = "README.md"
license = "MIT"
authors = [{ name = "Gabriel Cunha" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "certifi>=2024.2.2",
    "truststore>=0.9",
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=15",
    "pandera[polars]>=0.20",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "typer>=0.12",
    "loguru>=0.7",
    "streamlit>=1.36",
    "plotly>=5.20",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "fastexcel>=0.11",
]

[project.scripts]
raiox = "raiox.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data", "logs", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/**" = ["N999"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/raiox"]
