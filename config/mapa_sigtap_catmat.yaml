      Mesma haste (úmero, bloqueada), mas o valor SIGTAP inclui os parafusos de bloqueio e o
      CATMAT é só a haste (com tampão): a razão preço ÷ tabela fica subestimada.
  - codigo_sigtap: "0702030538"
    descricao_sigtap: HASTE INTRAMEDULAR BLOQUEADA DE UMERO (INCLUI PARAFUSOS)
    codigo_catmat: 438050
    familia: Hastes intramedulares
    confianca: media
    justificativa: Mesma haste; o valor SIGTAP inclui parafusos e o CATMAT não.

  # ----------------------------------------------------- Placas e parafusos ----
  - codigo_sigtap: "0702031046"
